[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jjmp3"
version = "0.4.0"
description = "Interactive CLI and local Web music player: search YouTube, download MP3, play from disk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "InquirerPy>=0.3.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/jejeprananda/jjmp3"
Repository = "https://github.com/jejeprananda/jjmp3"

[project.scripts]
jjmp3 = "mp3dl.cli:main"
jjmp3-web = "mp3dl.web.launcher:main"
jjmp3-desktop = "mp3dl.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mp3dl = ["web/static/**/*", "data/icons/*"]
