[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jjmp3"
version = "0.1.0"
description = "Interactive CLI to search YouTube and download MP3 via yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "InquirerPy>=0.3.4",
]

[project.urls]
Homepage = "https://github.com/jejeprananda/jjmp3"
Repository = "https://github.com/jejeprananda/jjmp3"

[project.scripts]
jjmp3 = "mp3dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
