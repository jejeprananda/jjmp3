<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJMP3 — Local Deck</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/jjmp3-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/jjmp3-256.png">
  <link rel="apple-touch-icon" href="/icons/jjmp3-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" class="deck" data-ready="false">
    <aside class="sidebar panel inset">
      <div class="brand">
        <img class="brand-mark" src="/icons/jjmp3-64.png" width="40" height="40" alt="">
        <div>
          <div class="brand-name">JJMP3</div>
          <div class="brand-sub">Local Deck · <span id="app-version">…</span></div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-view="library" type="button">
          <span class="nav-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          Library
        </button>
        <button class="nav-item" data-view="search" type="button">
          <span class="nav-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          Search
        </button>
        <button class="nav-item" data-view="explorer" type="button">
          <span class="nav-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v7A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5v-9Z" stroke="currentColor" stroke-width="1.6"/></svg></span>
          Explorer
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="section-label">Playlists</div>
        <div id="playlist-list" class="playlist-list"></div>
        <button id="btn-new-playlist" class="nav-item accent" type="button">
          <span class="nav-icon" aria-hidden="true">+</span>
          New playlist
        </button>
      </div>

      <div class="sidebar-foot">
        <button id="btn-settings" class="nav-item" data-view="settings" type="button">
          <span class="nav-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          Settings
        </button>
        <div id="path-chip" class="path-chip" title="">—</div>
      </div>
    </aside>

    <div class="stage">
      <header class="topbar panel">
        <div class="view-meta">
          <p class="eyebrow" id="view-eyebrow">Collection</p>
          <h1 id="view-title">Library</h1>
        </div>
        <div id="view-actions" class="view-actions"></div>
        <form id="search-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="search-input">Search YouTube</label>
          <input id="search-input" type="search" placeholder="Search YouTube to download…" enterkeyhint="search">
          <button type="submit" class="btn primary compact" id="btn-search">Search</button>
        </form>
      </header>

      <main id="main" class="main panel inset">
        <div id="track-list" class="track-list" role="list"></div>
        <div id="editor-panel" class="editor-panel hidden"></div>
        <div id="settings-panel" class="settings-panel hidden"></div>
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-poster" aria-hidden="true"></div>
          <p id="empty-copy">No tracks yet. Search and download your first MP3.</p>
        </div>
      </main>
    </div>

    <footer id="player" class="player panel">
      <div class="now-playing">
        <div class="cover-wrap">
          <img id="player-thumb" class="player-thumb" alt="" width="64" height="64">
          <canvas id="viz" class="viz" width="64" height="64" aria-hidden="true"></canvas>
          <div class="cover-fallback" aria-hidden="true"></div>
        </div>
        <div class="player-meta">
          <div id="player-title" class="player-title">Nothing playing</div>
          <div id="player-artist" class="player-artist">Local library</div>
        </div>
      </div>
      <div class="transport">
        <div class="transport-btns">
          <button id="btn-shuffle" class="icon-btn" type="button" title="Shuffle" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 3h5v5M21 3l-7 7M3 7h6l2 2M16 21h5v-5M21 21l-7-7M3 17h6l6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-prev" class="icon-btn" type="button" title="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6v12M18 6l-10 6 10 6V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-play" class="play-btn" type="button" title="Play" aria-label="Play">
            <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5L8 5.5Z"/></svg>
            <svg class="icon-pause hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7V5Zm7 0h3v14h-3V5Z"/></svg>
          </button>
          <button id="btn-next" class="icon-btn" type="button" title="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6v12M6 6l10 6-10 6V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-repeat" class="icon-btn" type="button" title="Repeat" data-mode="off">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h9a3 3 0 0 1 3 3v2M17 17H8a3 3 0 0 1-3-3v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 4l3 3-3 3M8 20l-3-3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="progress-row">
          <span id="time-current" class="mono">0:00</span>
          <input id="seek-bar" type="range" min="0" max="100" value="0" aria-label="Seek">
          <span id="time-total" class="mono">0:00</span>
        </div>
      </div>
      <div class="player-extra">
        <label class="volume" title="Volume">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h3l4 3V7L7 10H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="volume-bar" type="range" min="0" max="100" value="80" aria-label="Volume">
        </label>
      </div>
    </footer>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card panel">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn secondary" type="button">Cancel</button>
        <button id="modal-confirm" class="btn primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <script src="/vendor/gsap.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
